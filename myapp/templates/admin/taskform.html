<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>פרטי משימה</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50 to-slate-100 flex items-center justify-center px-4">

<div class="w-full max-w-lg">

    <div class="relative overflow-hidden rounded-[2rem] border border-white/60 bg-white/70 backdrop-blur-xl shadow-2xl shadow-slate-200/70 p-8">


        <div class="pointer-events-none absolute -top-24 -left-24 h-72 w-72 rounded-full bg-indigo-300/40 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-28 -right-28 h-72 w-72 rounded-full bg-emerald-300/30 blur-3xl"></div>

        <div class="relative">
            <h1 class="text-3xl font-black tracking-tight text-slate-900 text-center">
                פרטי משימה
            </h1>
            <p class="mt-2 text-center text-slate-600">
                הזיני את פרטי המשימה ושמרי אותם במערכת
            </p>

            <form method="post" class="mt-8 space-y-6">
                {% csrf_token %}


                <div class="[&>p]:space-y-1
                            [&_label]:block
                            [&_label]:text-sm
                            [&_label]:font-bold
                            [&_label]:text-slate-700
                            [&_helptext]:block
                            [&_helptext]:text-xs
                            [&_helptext]:text-slate-500
                            [&_helptext]:mt-1
                            [&_ul.errorlist]:list-none
                            [&_ul.errorlist]:p-0
                            [&_ul.errorlist]:m-0
                            [&_ul.errorlist_li]:text-sm
                            [&_ul.errorlist_li]:font-bold
                            [&_ul.errorlist_li]:text-rose-600
                            [&_input]:w-full
                            [&_input]:rounded-2xl
                            [&_input]:border
                            [&_input]:border-slate-200
                            [&_input]:bg-white
                            [&_input]:px-4
                            [&_input]:py-3
                            [&_input]:text-slate-900
                            [&_input]:outline-none
                            [&_input]:focus:ring-2
                            [&_input]:focus:ring-indigo-200
                            [&_input]:focus:border-indigo-400
                            [&_textarea]:w-full
                            [&_textarea]:rounded-2xl
                            [&_textarea]:border
                            [&_textarea]:border-slate-200
                            [&_textarea]:bg-white
                            [&_textarea]:px-4
                            [&_textarea]:py-3
                            [&_textarea]:outline-none
                            [&_textarea]:focus:ring-2
                            [&_textarea]:focus:ring-indigo-200
                            [&_select]:w-full
                            [&_select]:rounded-2xl
                            [&_select]:border
                            [&_select]:border-slate-200
                            [&_select]:bg-white
                            [&_select]:px-4
                            [&_select]:py-3
                            [&_select]:outline-none
                            [&_select]:focus:ring-2
                            [&_select]:focus:ring-indigo-200">
                    {{ formTask.as_p }}
                </div>

                <button type="submit"
                        class="w-full rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 shadow-lg shadow-indigo-200/70 transition active:scale-[0.99]">
                    שמירת משימה
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'my_tasks' %}"
                   class="text-sm font-semibold text-slate-500 hover:text-indigo-700">
                    ← ביטול וחזרה לרשימת המשימות
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
