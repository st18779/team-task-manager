
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>התחברות</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50 to-slate-100 flex items-center justify-center px-4">

<div class="w-full max-w-md">

    <div class="relative overflow-hidden rounded-[2rem] border border-white/60 bg-white/70 backdrop-blur-xl shadow-2xl shadow-slate-200/70 p-8">

        <!-- background glow -->
        <div class="pointer-events-none absolute -top-24 -left-24 h-72 w-72 rounded-full bg-indigo-300/40 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-28 -right-28 h-72 w-72 rounded-full bg-emerald-300/30 blur-3xl"></div>

        <div class="relative">
            <h1 class="text-3xl font-black tracking-tight text-slate-900 text-center">
                התחברות למערכת
            </h1>
            <p class="mt-2 text-center text-slate-600">
                הזיני שם משתמש וסיסמה כדי להמשיך
            </p>

            <form method="post" class="mt-8 space-y-5">
                {% csrf_token %}

                <!-- Django form fields -->
                <div class="[&>p]:space-y-1
                            [&_label]:block
                            [&_label]:text-sm
                            [&_label]:font-bold
                            [&_label]:text-slate-700
                            [&_select]:w-full
                            [&_select]:rounded-2xl
                            [&_select]:border
                            [&_select]:border-slate-200
                            [&_select]:bg-white
                            [&_select]:px-4
                            [&_select]:py-3
                            [&_select]:text-slate-900
                            [&_select]:outline-none
                            [&_select]:focus:ring-2
                            [&_select]:focus:ring-indigo-200
                            [&_input]:w-full
                            [&_input]:rounded-2xl
                            [&_input]:border
                            [&_input]:border-slate-200
                            [&_input]:bg-white
                            [&_input]:px-4
                            [&_input]:py-3
                            [&_input]:text-slate-900
                            [&_input]:outline-none
                            [&_input]:focus:ring-2
                            [&_input]:focus:ring-indigo-200
                            [&_input]:focus:border-indigo-400">
                    {{ form.as_p }}
                </div>

                <button type="submit"
                        class="w-full rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 shadow-lg shadow-indigo-200/70 transition active:scale-[0.99]">
                    התחברות
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-600">
                עדיין אין לך חשבון?
                <a href="{% url 'register' %}" class="font-bold text-indigo-700 hover:underline">
                    הרשמה למערכת
                </a>
            </div>

            <div class="mt-6 text-center">
                <a href="{% url 'home' %}" class="text-sm font-semibold text-slate-500 hover:text-indigo-700">
                    ← חזרה לדף הבית
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
