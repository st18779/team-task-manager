<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>מחיקת משימה</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50 to-slate-100 flex items-center justify-center px-4">

<div class="w-full max-w-md">
    <div class="relative overflow-hidden rounded-[2rem] border border-white/60 bg-white/70 backdrop-blur-xl shadow-2xl shadow-slate-200/70 p-8 text-center">

        <div class="pointer-events-none absolute -top-24 -left-24 h-72 w-72 rounded-full bg-rose-300/30 blur-3xl"></div>

        <div class="relative">
            <h1 class="text-3xl font-black tracking-tight text-slate-900">מחיקת משימה</h1>
            <p class="mt-4 text-slate-600">
                למחוק את המשימה <span class="font-bold text-slate-900">{{ task.task_name }}</span>?
                <br>אי אפשר לבטל את הפעולה.
            </p>

            <form method="post" class="mt-8">
                {% csrf_token %}
                <button type="submit"
                        class="w-full rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-black py-3.5 shadow-lg shadow-rose-200/70 transition active:scale-[0.99]">
                    כן, למחוק
                </button>
            </form>

            <div class="mt-6">
                <a href="{% url 'my_tasks' %}" class="text-sm font-semibold text-slate-500 hover:text-indigo-700">
                    ← ביטול וחזרה לרשימת המשימות
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
